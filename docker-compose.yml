services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-eda-api
    ports:
      - '3000:3000'
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: postgres
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop-eda

  postgres:
    image: postgres:17-alpine
    container_name: shop-eda-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_eda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shop_eda']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shop-eda

volumes:
  postgres_data:

networks:
  shop-eda:
    driver: bridge
