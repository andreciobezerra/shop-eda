services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-eda-api
    ports:
      - '3000:3000'
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop-eda

  postgres:
    image: postgres:17-alpine
    container_name: shop-eda-db
    ports:
      - '5432:5432'
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST: postgres
    volumes:
      - ./apps/api/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shop-eda

networks:
  shop-eda:
    driver: bridge
